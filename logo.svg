<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01081c"/>
      <stop offset="100%" stop-color="#03133f"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3040ff"/>
      <stop offset="100%" stop-color="#24e1e8"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>

  <!-- Main P Symbol -->
  <g filter="url(#shadow)">
    <path d="
      M 350 240
      Q 350 180 410 180
      L 720 180
      Q 860 180 860 320
      L 860 420
      Q 860 560 720 560
      L 520 560
      L 520 670
      Q 520 720 470 720
      Q 420 720 420 670
      L 420 320
      Q 420 260 480 260
      L 700 260
      Q 760 260 760 320
      L 760 410
      Q 760 470 700 470
      L 540 470
      L 470 540
      L 470 300
      Q 470 240 530 240
      Z"
      fill="url(#logoGrad)"/>

    <!-- Eyes -->
    <rect x="560" y="330" rx="15" ry="15" width="28" height="60" fill="#24e1e8"/>
    <rect x="650" y="330" rx="15" ry="15" width="28" height="60" fill="#24e1e8"/>
  </g>

  <!-- Text -->
  <text x="120" y="860"
        font-family="Arial, Helvetica, sans-serif"
        font-size="120"
        font-weight="700"
        fill="white">
    ProMis
  </text>

  <text x="700" y="860"
        font-family="Arial, Helvetica, sans-serif"
        font-size="120"
        font-weight="700"
        fill="#24cfff">
    Ai
  </text>

  <text x="900" y="860"
        font-family="Arial, Helvetica, sans-serif"
        font-size="70"
        fill="white">
    .com
  </text>

  <!-- Arabic Tagline -->
  <line x1="130" y1="950" x2="320" y2="950" stroke="#24cfff" stroke-width="6"/>
  <line x1="880" y1="950" x2="1070" y2="950" stroke="#24cfff" stroke-width="6"/>

  <text x="600" y="980"
        font-family="Arial"
        font-size="70"
        text-anchor="middle"
        fill="white">
    المساعد الذكي
  </text>

</svg>
